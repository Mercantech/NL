server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache static assets lightly (HTML stays fresh)
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /qa {
        return 301 /qa.html;
    }

    location = /pakkeliste {
        return 301 /pakkeliste.html;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Security headers (Traefik/tunnel may add more)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
