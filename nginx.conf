# Cloudflare overwrites this header at the public edge. Fall back to the peer
# address for local traffic; the API also limits failed attempts independently.
map $http_cf_connecting_ip $ticket_client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

map "$request_method:$uri" $ticket_unlock_key {
    default "";
    "POST:/api/tickets/unlock" $ticket_client_ip;
}

limit_req_zone $ticket_unlock_key zone=ticket_unlock:1m rate=12r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # The ticket API is only reachable through this proxy on the private network.
    # Original PDFs live in the API's persistent volume, never in the web root.
    location ^~ /api/tickets/ {
        client_max_body_size 12m;
        limit_req zone=ticket_unlock burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://ticket-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Ticket-Client-IP $ticket_client_ip;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /billetter {
        return 301 /billetter.html;
    }

    # HTML always fresh (Cloudflare respects this)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # CSS/JS: short browser cache; revalidate so deploys show up quickly
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /qa {
        return 301 /qa.html;
    }

    location = /pakkeliste {
        return 301 /pakkeliste.html;
    }

    location = /previous-years {
        return 301 /previous-years.html;
    }

    location = /learning-objectives {
        return 301 /learning-objectives.html;
    }

    location = /2026 {
        return 301 /2026.html;
    }

    location = /tidligere {
        return 301 /previous-years.html;
    }

    # Media (photos/videos)
    location /media/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ $uri.html /index.html;
    }
}
