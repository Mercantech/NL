# Lokal udvikling med host-port (kræver stadig dokploy-network ELLER brug standalone nedenfor).
#
# Hurtig lokal (anbefalet):
#   docker compose -f docker-compose.local.yml up --build
#
# Eller sammen med prod-filen (kræver: docker network create dokploy-network):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${LOCAL_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
